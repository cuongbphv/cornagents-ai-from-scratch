<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">CornLoop: ba vòng và ba cửa</title><desc id="desc">Vòng nhiệm vụ và vòng học chịu quyền, quota, hủy, thu hồi, evaluator độc lập và duyệt bên ngoài model. G1 người học; G2 hệ thống; G3 bản cải tiến.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="#52677f"/></marker>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#b5c8dd" opacity=".26"/></pattern></defs>
<style>text{font-family:"Segoe UI",Arial,sans-serif} .station{animation:breathe 10s ease-in-out infinite} @keyframes breathe{0%,70%,100%{stroke-opacity:.35}35%{stroke-opacity:1}} @media(prefers-reduced-motion:reduce){.motion{display:none}.station{animation:none}}</style>
<rect x="0" y="0" width="1200" height="790" rx="24" fill="#f3f7fc"/><rect width="1200" height="790" fill="url(#grid)" rx="24"/>
<text x="48" y="56" font-size="26" font-weight="700" fill="#9333ea" text-anchor="start">CornLoop</text><text x="48" y="104" font-size="34" font-weight="750" fill="#13263e" text-anchor="start">Nghiên cứu, học và kiểm soát: ba vòng riêng</text><rect x="48" y="149" width="760" height="255" rx="18" fill="#eaf3fb"/><text x="72" y="184" font-size="23" font-weight="700" fill="#2563eb" text-anchor="start">Vòng nhiệm vụ</text><text x="292" y="184" font-size="17" font-weight="500" fill="#52677f" text-anchor="start">Tìm điều đúng trong phạm vi đã giao</text><rect x="72" y="218" width="166" height="92" rx="18" fill="#fff" stroke="#cad8e8"/><rect x="72" y="218" width="5" height="92" rx="2" fill="#2563eb"/><text x="88" y="252" font-size="20" font-weight="700" fill="#13263e" text-anchor="start">Câu hỏi</text><text x="88" y="282" font-size="16" font-weight="500" fill="#52677f" text-anchor="start">Scope + budget</text><path d="M238 264H252" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="motion"><circle r="6" fill="#2563eb" stroke="#fff" stroke-width="2"><animateMotion dur="4s" begin="0s" repeatCount="indefinite" path="M238 264H252"/></circle></g><rect x="253" y="218" width="166" height="92" rx="18" fill="#fff" stroke="#cad8e8"/><rect x="253" y="218" width="5" height="92" rx="2" fill="#2563eb"/><text x="269" y="252" font-size="20" font-weight="700" fill="#13263e" text-anchor="start">Tìm nguồn</text><text x="269" y="282" font-size="16" font-weight="500" fill="#52677f" text-anchor="start">Evidence ledger</text><path d="M419 264H433" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="motion"><circle r="6" fill="#2563eb" stroke="#fff" stroke-width="2"><animateMotion dur="4s" begin="1s" repeatCount="indefinite" path="M419 264H433"/></circle></g><rect x="434" y="218" width="166" height="92" rx="18" fill="#fff" stroke="#cad8e8"/><rect x="434" y="218" width="5" height="92" rx="2" fill="#2563eb"/><text x="450" y="252" font-size="20" font-weight="700" fill="#13263e" text-anchor="start">Thử &amp; kiểm</text><text x="450" y="282" font-size="16" font-weight="500" fill="#52677f" text-anchor="start">Lưu cả lần sai</text><path d="M600 264H614" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="motion"><circle r="6" fill="#2563eb" stroke="#fff" stroke-width="2"><animateMotion dur="4s" begin="2s" repeatCount="indefinite" path="M600 264H614"/></circle></g><rect x="615" y="218" width="166" height="92" rx="18" fill="#fff" stroke="#cad8e8"/><rect x="615" y="218" width="5" height="92" rx="2" fill="#2563eb"/><text x="631" y="252" font-size="20" font-weight="700" fill="#13263e" text-anchor="start">Kết luận</text><text x="631" y="282" font-size="16" font-weight="500" fill="#52677f" text-anchor="start">Nêu giới hạn</text><path d="M698 318V353H155V317" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="motion"><circle r="6" fill="#2563eb" stroke="#fff" stroke-width="2"><animateMotion dur="14s" begin="0s" repeatCount="indefinite" path="M698 318V353H155V317"/></circle></g><text x="344" y="381" font-size="16" font-weight="500" fill="#52677f" text-anchor="start">Còn câu hỏi? Lặp trong budget; hết thì dừng.</text><rect x="842" y="149" width="310" height="255" rx="18" fill="#fff" stroke="#9333ea"/><text x="866" y="184" font-size="23" font-weight="700" fill="#9333ea" text-anchor="start">Vòng kiểm soát</text><text x="866" y="222" font-size="18" font-weight="650" fill="#13263e" text-anchor="start">Quyền · quota · hủy · thu hồi</text><text x="866" y="254" font-size="18" font-weight="500" fill="#52677f" text-anchor="start">Kiểm bên ngoài model</text><text x="866" y="291" font-size="19" font-weight="700" fill="#13263e" text-anchor="start">Evaluator độc lập</text><text x="866" y="323" font-size="18" font-weight="500" fill="#52677f" text-anchor="start">Duyệt đúng digest và scope</text><text x="866" y="378" font-size="17" font-weight="650" fill="#9333ea" text-anchor="start">Agent đề nghị; không tự duyệt.</text><path d="M842 279H811" fill="none" stroke="#9333ea" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 6"/><path d="M430 404V465" fill="none" stroke="#0891b2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="motion"><circle r="6" fill="#0891b2" stroke="#fff" stroke-width="2"><animateMotion dur="5s" begin="0s" repeatCount="indefinite" path="M430 404V465"/></circle></g><text x="451" y="443" font-size="17" font-weight="500" fill="#52677f" text-anchor="start">Trải nghiệm có nguồn</text><rect x="48" y="466" width="1104" height="167" rx="18" fill="#ecf7f1"/><text x="72" y="500" font-size="23" font-weight="700" fill="#16805a" text-anchor="start">Vòng học</text><text x="214" y="500" font-size="17" font-weight="500" fill="#52677f" text-anchor="start">Thay đổi nhỏ, giữ riêng để kiểm</text><rect x="72" y="522" width="252" height="92" rx="18" fill="#fff" stroke="#cad8e8"/><rect x="72" y="522" width="5" height="92" rx="2" fill="#16805a"/><text x="88" y="556" font-size="20" font-weight="700" fill="#13263e" text-anchor="start">Nhận diện lỗi</text><text x="88" y="586" font-size="16" font-weight="500" fill="#52677f" text-anchor="start">Không học đáp án test</text><path d="M324 568H346" fill="none" stroke="#16805a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="motion"><circle r="6" fill="#16805a" stroke="#fff" stroke-width="2"><animateMotion dur="5s" begin="0s" repeatCount="indefinite" path="M324 568H346"/></circle></g><rect x="347" y="522" width="252" height="92" rx="18" fill="#fff" stroke="#cad8e8"/><rect x="347" y="522" width="5" height="92" rx="2" fill="#16805a"/><text x="363" y="556" font-size="20" font-weight="700" fill="#13263e" text-anchor="start">Đề nghị lesson</text><text x="363" y="586" font-size="16" font-weight="500" fill="#52677f" text-anchor="start">Điều kiện + phản ví dụ</text><path d="M599 568H621" fill="none" stroke="#16805a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="motion"><circle r="6" fill="#16805a" stroke="#fff" stroke-width="2"><animateMotion dur="5s" begin="1s" repeatCount="indefinite" path="M599 568H621"/></circle></g><rect x="622" y="522" width="252" height="92" rx="18" fill="#fff" stroke="#cad8e8"/><rect x="622" y="522" width="5" height="92" rx="2" fill="#16805a"/><text x="638" y="556" font-size="20" font-weight="700" fill="#13263e" text-anchor="start">Đánh giá</text><text x="638" y="586" font-size="16" font-weight="500" fill="#52677f" text-anchor="start">Task mới + retention</text><path d="M874 568H896" fill="none" stroke="#16805a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="motion"><circle r="6" fill="#16805a" stroke="#fff" stroke-width="2"><animateMotion dur="5s" begin="2s" repeatCount="indefinite" path="M874 568H896"/></circle></g><rect x="897" y="522" width="252" height="92" rx="18" fill="#fff" stroke="#cad8e8"/><rect x="897" y="522" width="5" height="92" rx="2" fill="#16805a"/><text x="913" y="556" font-size="20" font-weight="700" fill="#13263e" text-anchor="start">G3: xét thay đổi</text><text x="913" y="586" font-size="16" font-weight="500" fill="#52677f" text-anchor="start">Đủ bằng chứng mới duyệt</text><path d="M997 404V464" fill="none" stroke="#9333ea" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 6"/><text x="48" y="688" font-size="22" font-weight="700" fill="#2563eb" text-anchor="start">G1 · Người học</text><text x="48" y="720" font-size="19" font-weight="500" fill="#52677f" text-anchor="start">Tự giải thích và sửa lỗi</text><text x="422" y="688" font-size="22" font-weight="700" fill="#0891b2" text-anchor="start">G2 · Hệ thống</text><text x="422" y="720" font-size="19" font-weight="500" fill="#52677f" text-anchor="start">Outcome có bằng chứng</text><text x="796" y="688" font-size="22" font-weight="700" fill="#9333ea" text-anchor="start">G3 · Bản cải tiến</text><text x="796" y="720" font-size="19" font-weight="500" fill="#52677f" text-anchor="start">Đúng bản, đúng phạm vi</text><text x="48" y="760" font-size="16" font-weight="500" fill="#52677f" text-anchor="start">Ba cửa không bù điểm cho nhau. Đây là thiết kế, không phải bằng chứng agent đã tự học hiệu quả.</text>
</svg>