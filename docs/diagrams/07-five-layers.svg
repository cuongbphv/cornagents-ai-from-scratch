<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="580" height="430" viewBox="0 0 580 430" role="img">
  <title>Five engineering layers</title>
  <desc>Prompt to Graph</desc>
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#0f172a" opacity="0.05"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="20%" stop-color="#2563eb"/>
      <stop offset="40%" stop-color="#d97706"/>
      <stop offset="55%" stop-color="#e11d48"/>
      <stop offset="70%" stop-color="#0891b2"/>
      <stop offset="85%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="580" height="430" rx="18" fill="#eef3f9"/>
  <rect width="580" height="430" rx="18" fill="url(#dots)"/>

<text x="28" y="40" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">5 tầng · CornAgents.AI</text>
<text x="28" y="62" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#64748b">Phase 3 · từ prompt tới knowledge graph</text>
<rect x="70.0" y="92" width="440" height="48" rx="14" fill="#0d9488" filter="url(#soft)"/>
<text x="290.0" y="122" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">1 · Prompt engineering</text>
<rect x="70.0" y="92" width="440" height="48" rx="14" fill="#fff" opacity="0"><animate attributeName="opacity" values="0;0.14;0" dur="3.6s" begin="0.0s" repeatCount="indefinite"/></rect>
<line x1="290.0" y1="140" x2="290.0" y2="152" stroke="#dbe3ee" stroke-width="3"/>
<rect x="81.0" y="154" width="418" height="48" rx="14" fill="#2563eb" filter="url(#soft)"/>
<text x="290.0" y="184" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">2 · Context engineering</text>
<rect x="81.0" y="154" width="418" height="48" rx="14" fill="#fff" opacity="0"><animate attributeName="opacity" values="0;0.14;0" dur="3.6s" begin="0.28s" repeatCount="indefinite"/></rect>
<line x1="290.0" y1="202" x2="290.0" y2="214" stroke="#dbe3ee" stroke-width="3"/>
<rect x="92.0" y="216" width="396" height="48" rx="14" fill="#d97706" filter="url(#soft)"/>
<text x="290.0" y="246" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">3 · Harness engineering</text>
<rect x="92.0" y="216" width="396" height="48" rx="14" fill="#fff" opacity="0"><animate attributeName="opacity" values="0;0.14;0" dur="3.6s" begin="0.56s" repeatCount="indefinite"/></rect>
<line x1="290.0" y1="264" x2="290.0" y2="276" stroke="#dbe3ee" stroke-width="3"/>
<rect x="103.0" y="278" width="374" height="48" rx="14" fill="#e11d48" filter="url(#soft)"/>
<text x="290.0" y="308" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">4 · Loop engineering</text>
<rect x="103.0" y="278" width="374" height="48" rx="14" fill="#fff" opacity="0"><animate attributeName="opacity" values="0;0.14;0" dur="3.6s" begin="0.84s" repeatCount="indefinite"/></rect>
<line x1="290.0" y1="326" x2="290.0" y2="338" stroke="#dbe3ee" stroke-width="3"/>
<rect x="114.0" y="340" width="352" height="48" rx="14" fill="#4f46e5" filter="url(#soft)"/>
<text x="290.0" y="370" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">5 · Graph engineering</text>
<rect x="114.0" y="340" width="352" height="48" rx="14" fill="#fff" opacity="0"><animate attributeName="opacity" values="0;0.14;0" dur="3.6s" begin="1.12s" repeatCount="indefinite"/></rect>
<circle r="5" fill="#fff" stroke="#4f46e5" stroke-width="2"><animateMotion dur="4.2s" repeatCount="indefinite" path="M290.0 116 V 364"/></circle></svg>
