<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="540" height="390" viewBox="0 0 540 390" role="img">
  <title>Attention stack</title>
  <desc>Minimal GPT forward pass</desc>
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#0f172a" opacity="0.05"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="20%" stop-color="#2563eb"/>
      <stop offset="40%" stop-color="#d97706"/>
      <stop offset="55%" stop-color="#e11d48"/>
      <stop offset="70%" stop-color="#0891b2"/>
      <stop offset="85%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="540" height="390" rx="18" fill="#eef3f9"/>
  <rect width="540" height="390" rx="18" fill="url(#dots)"/>

<text x="28" y="40" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Mental model · attention stack</text>
<text x="28" y="62" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#64748b">Phase 1 · forward pass tối giản</text>
<rect x="64" y="88" width="412" height="54" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="2" filter="url(#soft)"/>
<rect x="64" y="88" width="12" height="54" rx="6" fill="#0d9488"/>
<circle cx="106" cy="115" r="15" fill="#0d9488"/>
<text x="106" y="120" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">1</text>
<text x="136" y="120" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Embed + positional encoding</text>
<line x1="270" y1="142" x2="270" y2="160" stroke="#dbe3ee" stroke-width="3"/>
<rect x="64" y="158" width="412" height="54" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#soft)"/>
<rect x="64" y="158" width="12" height="54" rx="6" fill="#2563eb"/>
<circle cx="106" cy="185" r="15" fill="#2563eb"/>
<text x="106" y="190" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">2</text>
<text x="136" y="190" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Causal multi-head attention</text>
<line x1="270" y1="212" x2="270" y2="230" stroke="#dbe3ee" stroke-width="3"/>
<rect x="64" y="228" width="412" height="54" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#soft)"/>
<rect x="64" y="228" width="12" height="54" rx="6" fill="#2563eb"/>
<circle cx="106" cy="255" r="15" fill="#2563eb"/>
<text x="106" y="260" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">3</text>
<text x="136" y="260" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Transformer block (N×)</text>
<line x1="270" y1="282" x2="270" y2="300" stroke="#dbe3ee" stroke-width="3"/>
<rect x="64" y="298" width="412" height="54" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="2" filter="url(#soft)"/>
<rect x="64" y="298" width="12" height="54" rx="6" fill="#d97706"/>
<circle cx="106" cy="325" r="15" fill="#d97706"/>
<text x="106" y="330" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">4</text>
<text x="136" y="330" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">LM head → next-token logits</text>
<circle r="5" fill="#2563eb"><animateMotion dur="4s" repeatCount="indefinite" path="M270 115 V 325"/></circle></svg>
