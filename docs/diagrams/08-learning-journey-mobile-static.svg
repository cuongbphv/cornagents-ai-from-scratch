<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1190" viewBox="0 0 600 1190" role="img" aria-labelledby="title desc">
<title id="title">CornAgents.AI: hành trình 36 tuần, bản dọc</title><desc id="desc">Cùng năm chặng của lịch học, bố cục dọc để đọc trên màn hình nhỏ.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="#52677f"/></marker>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#b5c8dd" opacity=".26"/></pattern></defs>
<style>text{font-family:"Segoe UI",Arial,sans-serif} .station{animation:none} @keyframes breathe{0%,70%,100%{stroke-opacity:.35}35%{stroke-opacity:1}} @media(prefers-reduced-motion:reduce){.motion{display:none}.station{animation:none}}</style>
<rect x="0" y="0" width="600" height="1190" rx="24" fill="#f3f7fc"/><rect width="600" height="1190" fill="url(#grid)" rx="24"/>
<text x="32" y="52" font-size="27" font-weight="700" fill="#0d9488" text-anchor="start">CornAgents.AI</text><text x="32" y="92" font-size="32" font-weight="750" fill="#13263e" text-anchor="start">Hành trình 36 tuần</text><text x="32" y="128" font-size="20" font-weight="500" fill="#52677f" text-anchor="start">24 tuần nền + 12 tuần nghiên cứu</text><path d="M62 208V970" fill="none" stroke="#cad8e8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M62 208V970" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="62" cy="226" r="14" fill="#fff" stroke="#0d9488" stroke-width="4"/><rect x="98" y="178" width="466" height="150" rx="18" fill="#fff" stroke="#cad8e8"/><text x="120" y="209" font-size="20" font-weight="700" fill="#0d9488" text-anchor="start">Tuần 1–4</text><text x="120" y="243" font-size="26" font-weight="700" fill="#13263e" text-anchor="start">Nền toán và phép đo</text><text x="120" y="276" font-size="21" font-weight="500" fill="#52677f" text-anchor="start">Task, baseline, gradient</text><text x="120" y="308" font-size="21" font-weight="650" fill="#0d9488" text-anchor="start">Manifest + phép kiểm</text><circle cx="62" cy="406" r="14" fill="#fff" stroke="#2563eb" stroke-width="4"/><rect x="98" y="358" width="466" height="150" rx="18" fill="#fff" stroke="#cad8e8"/><text x="120" y="389" font-size="20" font-weight="700" fill="#2563eb" text-anchor="start">Tuần 5–14</text><text x="120" y="423" font-size="26" font-weight="700" fill="#13263e" text-anchor="start">Hiểu nội tại LLM</text><text x="120" y="456" font-size="21" font-weight="500" fill="#52677f" text-anchor="start">Autograd, Transformer</text><text x="120" y="488" font-size="21" font-weight="650" fill="#2563eb" text-anchor="start">Code lõi + loss log</text><circle cx="62" cy="586" r="14" fill="#fff" stroke="#0891b2" stroke-width="4"/><rect x="98" y="538" width="466" height="150" rx="18" fill="#fff" stroke="#cad8e8"/><text x="120" y="569" font-size="20" font-weight="700" fill="#0891b2" text-anchor="start">Tuần 15–18</text><text x="120" y="603" font-size="26" font-weight="700" fill="#13263e" text-anchor="start">Retrieval và tài liệu</text><text x="120" y="636" font-size="21" font-weight="500" fill="#52677f" text-anchor="start">Evidence, số, đơn vị</text><text x="120" y="668" font-size="21" font-weight="650" fill="#0891b2" text-anchor="start">Nguồn + báo cáo lỗi</text><circle cx="62" cy="766" r="14" fill="#fff" stroke="#9333ea" stroke-width="4"/><rect x="98" y="718" width="466" height="150" rx="18" fill="#fff" stroke="#cad8e8"/><text x="120" y="749" font-size="20" font-weight="700" fill="#9333ea" text-anchor="start">Tuần 19–24</text><text x="120" y="783" font-size="26" font-weight="700" fill="#13263e" text-anchor="start">Agent và capstone</text><text x="120" y="816" font-size="21" font-weight="500" fill="#52677f" text-anchor="start">Tools, quota, recovery</text><text x="120" y="848" font-size="21" font-weight="650" fill="#9333ea" text-anchor="start">Failure tests + capstone</text><circle cx="62" cy="946" r="14" fill="#fff" stroke="#d97706" stroke-width="4"/><rect x="98" y="898" width="466" height="150" rx="18" fill="#fff" stroke="#cad8e8"/><text x="120" y="929" font-size="20" font-weight="700" fill="#d97706" text-anchor="start">Tuần 25–36</text><text x="120" y="963" font-size="26" font-weight="700" fill="#13263e" text-anchor="start">Nghiên cứu và học</text><text x="120" y="996" font-size="21" font-weight="500" fill="#52677f" text-anchor="start">Lesson, eval, rollback</text><text x="120" y="1028" font-size="21" font-weight="650" fill="#d97706" text-anchor="start">R01–R12 + protocol</text><text x="32" y="1120" font-size="23" font-weight="650" fill="#13263e" text-anchor="start">Tự viết · Gây lỗi · Đo · Giải thích</text><text x="32" y="1157" font-size="19" font-weight="500" fill="#52677f" text-anchor="start">Motion minh họa, không phải tiến độ thực.</text>
</svg>