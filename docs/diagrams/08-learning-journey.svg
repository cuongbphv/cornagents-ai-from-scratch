<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="572" viewBox="0 0 1200 572" role="img" aria-labelledby="title desc">
<title id="title">CornAgents.AI: hành trình 36 tuần</title><desc id="desc">Năm chặng: tuần 1–4 phép đo và toán; 5–14 nội tại LLM; 15–18 retrieval và tài liệu; 19–24 agent và capstone; 25–36 nghiên cứu và học. Motion chỉ minh họa hướng học.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="#52677f"/></marker>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#b5c8dd" opacity=".26"/></pattern></defs>
<style>text{font-family:"Segoe UI",Arial,sans-serif} .station{animation:breathe 10s ease-in-out infinite} @keyframes breathe{0%,70%,100%{stroke-opacity:.35}35%{stroke-opacity:1}} @media(prefers-reduced-motion:reduce){.motion{display:none}.station{animation:none}}</style>
<rect x="0" y="0" width="1200" height="572" rx="24" fill="#f3f7fc"/><rect width="1200" height="572" fill="url(#grid)" rx="24"/>
<text x="48" y="58" font-size="24" font-weight="700" fill="#0d9488" text-anchor="start">CornAgents.AI</text><text x="48" y="112" font-size="36" font-weight="750" fill="#13263e" text-anchor="start">Từ một phép tính đến một vòng nghiên cứu</text><text x="48" y="149" font-size="19" font-weight="500" fill="#52677f" text-anchor="start">24 tuần nền tảng + 12 tuần nghiên cứu · Mỗi chặng để lại một sản phẩm để kiểm.</text><path d="M150 260H1050" fill="none" stroke="#cad8e8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 260H1050" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="motion"><circle r="6" fill="#2563eb" stroke="#fff" stroke-width="2"><animateMotion dur="16s" begin="0s" repeatCount="indefinite" path="M150 260H1050"/></circle></g><g transform="translate(136 190)" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="7" height="7" rx="2"/><rect x="0" y="12" width="7" height="7" rx="2"/><rect x="0" y="24" width="7" height="7" rx="2"/><rect x="12" y="0" width="7" height="7" rx="2"/><rect x="12" y="12" width="7" height="7" rx="2"/><rect x="12" y="24" width="7" height="7" rx="2"/><rect x="24" y="0" width="7" height="7" rx="2"/><rect x="24" y="12" width="7" height="7" rx="2"/><rect x="24" y="24" width="7" height="7" rx="2"/></g><circle cx="152" cy="260" r="16" fill="#fff" stroke="#0d9488" stroke-width="4" class="station" style="animation-delay:0.0s"/><circle cx="152" cy="260" r="5" fill="#0d9488"/><rect x="48" y="302" width="208" height="163" rx="18" fill="#fff" stroke="#cad8e8"/><rect x="64" y="318" width="90" height="29" rx="8" fill="#0d9488"/><text x="109" y="339" font-size="16" font-weight="650" fill="#fff" text-anchor="middle">Tuần 1–4</text><text x="64" y="382" font-size="19" font-weight="700" fill="#13263e" text-anchor="start">Nền toán &amp; phép đo</text><text x="64" y="414" font-size="15" font-weight="500" fill="#52677f" text-anchor="start">Task, baseline, gradient</text><text x="64" y="442" font-size="15" font-weight="650" fill="#0d9488" text-anchor="start">Manifest + phép kiểm</text><g transform="translate(360 190)" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M0 4H30M0 16H30M0 28H30M5 0V32M25 0V32"/><circle cx="15" cy="16" r="6" fill="#fff"/></g><circle cx="376" cy="260" r="16" fill="#fff" stroke="#2563eb" stroke-width="4" class="station" style="animation-delay:1.7s"/><circle cx="376" cy="260" r="5" fill="#2563eb"/><rect x="272" y="302" width="208" height="163" rx="18" fill="#fff" stroke="#cad8e8"/><rect x="288" y="318" width="90" height="29" rx="8" fill="#2563eb"/><text x="333" y="339" font-size="16" font-weight="650" fill="#fff" text-anchor="middle">Tuần 5–14</text><text x="288" y="382" font-size="19" font-weight="700" fill="#13263e" text-anchor="start">Hiểu nội tại LLM</text><text x="288" y="414" font-size="15" font-weight="500" fill="#52677f" text-anchor="start">Autograd, Transformer</text><text x="288" y="442" font-size="15" font-weight="650" fill="#2563eb" text-anchor="start">Code lõi + loss log</text><g transform="translate(584 190)" fill="none" stroke="#0891b2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="0" width="22" height="31" rx="3"/><path d="M8 8H18M8 14H18M8 20H14"/><circle cx="25" cy="25" r="7" fill="#fff"/><path d="M30 30L35 35"/></g><circle cx="600" cy="260" r="16" fill="#fff" stroke="#0891b2" stroke-width="4" class="station" style="animation-delay:3.4s"/><circle cx="600" cy="260" r="5" fill="#0891b2"/><rect x="496" y="302" width="208" height="163" rx="18" fill="#fff" stroke="#cad8e8"/><rect x="512" y="318" width="90" height="29" rx="8" fill="#0891b2"/><text x="557" y="339" font-size="16" font-weight="650" fill="#fff" text-anchor="middle">Tuần 15–18</text><text x="512" y="382" font-size="19" font-weight="700" fill="#13263e" text-anchor="start">Retrieval &amp; tài liệu</text><text x="512" y="414" font-size="15" font-weight="500" fill="#52677f" text-anchor="start">Nguồn, số, đơn vị</text><text x="512" y="442" font-size="15" font-weight="650" fill="#0891b2" text-anchor="start">Evidence + báo cáo lỗi</text><g transform="translate(808 190)" fill="none" stroke="#9333ea" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="16" r="8"/><circle cx="0" cy="0" r="3"/><circle cx="32" cy="0" r="3"/><circle cx="0" cy="32" r="3"/><circle cx="32" cy="32" r="3"/><path d="M3 3L10 10M22 10L29 3M3 29L10 22M22 22L29 29"/></g><circle cx="824" cy="260" r="16" fill="#fff" stroke="#9333ea" stroke-width="4" class="station" style="animation-delay:5.1s"/><circle cx="824" cy="260" r="5" fill="#9333ea"/><rect x="720" y="302" width="208" height="163" rx="18" fill="#fff" stroke="#cad8e8"/><rect x="736" y="318" width="90" height="29" rx="8" fill="#9333ea"/><text x="781" y="339" font-size="16" font-weight="650" fill="#fff" text-anchor="middle">Tuần 19–24</text><text x="736" y="382" font-size="19" font-weight="700" fill="#13263e" text-anchor="start">Agent &amp; capstone</text><text x="736" y="414" font-size="15" font-weight="500" fill="#52677f" text-anchor="start">Tools, quota, recovery</text><text x="736" y="442" font-size="15" font-weight="650" fill="#9333ea" text-anchor="start">Failure tests + capstone</text><g transform="translate(1032 190)" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 32V12M16 20C0 20 0 3 16 12M16 16C32 16 32 0 16 8"/><path d="M3 32H29"/></g><circle cx="1048" cy="260" r="16" fill="#fff" stroke="#d97706" stroke-width="4" class="station" style="animation-delay:6.8s"/><circle cx="1048" cy="260" r="5" fill="#d97706"/><rect x="944" y="302" width="208" height="163" rx="18" fill="#fff" stroke="#cad8e8"/><rect x="960" y="318" width="90" height="29" rx="8" fill="#d97706"/><text x="1005" y="339" font-size="16" font-weight="650" fill="#fff" text-anchor="middle">Tuần 25–36</text><text x="960" y="382" font-size="19" font-weight="700" fill="#13263e" text-anchor="start">Nghiên cứu &amp; học</text><text x="960" y="414" font-size="15" font-weight="500" fill="#52677f" text-anchor="start">Lesson, eval, rollback</text><text x="960" y="442" font-size="15" font-weight="650" fill="#d97706" text-anchor="start">R01–R12 + protocol</text><text x="48" y="509" font-size="22" font-weight="650" fill="#13263e" text-anchor="start">Tự viết  →  Gây lỗi  →  Đo  →  Giải thích  →  Thử bài mới</text><text x="48" y="541" font-size="16" font-weight="500" fill="#52677f" text-anchor="start">Hình mô tả lịch học; chuyển động không biểu thị tiến độ hoặc kết quả đã đạt.</text>
</svg>