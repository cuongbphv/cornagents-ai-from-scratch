<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img">
  <title>Local vs cloud</title>
  <desc>Decision tree for renting GPU</desc>
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#0f172a" opacity="0.05"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="20%" stop-color="#2563eb"/>
      <stop offset="40%" stop-color="#d97706"/>
      <stop offset="55%" stop-color="#e11d48"/>
      <stop offset="70%" stop-color="#0891b2"/>
      <stop offset="85%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="760" height="340" rx="18" fill="#eef3f9"/>
  <rect width="760" height="340" rx="18" fill="url(#dots)"/>

<text x="32" y="38" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Quyết định local ↔ cloud</text>
<text x="32" y="60" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#64748b">Validate local trước; thuê GPU khi chạm ngưỡng</text>
<rect x="270" y="78" width="220" height="40" rx="20" fill="#2563eb" filter="url(#soft)"/>
<text x="380" y="103" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">Bắt đầu workload</text>
<line x1="380" y1="118" x2="380" y2="140" stroke="#94a3b8" stroke-width="2.5"/>
<rect x="250" y="140" width="260" height="42" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="2" filter="url(#soft)"/>
<text x="380" y="166" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Validate / train local</text>
<line x1="380" y1="182" x2="380" y2="204" stroke="#94a3b8" stroke-width="2.5"/>
<rect x="210" y="204" width="340" height="52" rx="14" fill="#d97706" filter="url(#soft)"/>
<text x="380" y="226" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">OOM ở batch=1</text>
<text x="380" y="244" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#fff">hoặc dự phóng &gt; 24 giờ?</text>
<path d="M210 230 H120 V268" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowHead)"/>
<path d="M550 230 H640 V268" fill="none" stroke="#e11d48" stroke-width="2.5" marker-end="url(#arrowHead)"/>
<text x="150" y="222" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#16a34a">Không</text>
<text x="610" y="222" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#e11d48">Có</text>
<rect x="40" y="276" width="160" height="36" rx="12" fill="#16a34a" filter="url(#soft)"/>
<text x="120" y="299" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">Ở lại local</text>
<rect x="560" y="276" width="160" height="36" rx="12" fill="#e11d48" filter="url(#soft)"/>
<text x="640" y="299" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">Thuê cloud GPU</text>
<circle r="4" fill="#2563eb"><animateMotion dur="3s" repeatCount="indefinite" path="M380 98 V161"/></circle>
<circle r="3.5" fill="#16a34a"><animateMotion dur="3.5s" begin="0.4s" repeatCount="indefinite" path="M210 230 H120 V294"/></circle>
<circle r="3.5" fill="#e11d48"><animateMotion dur="3.5s" begin="1s" repeatCount="indefinite" path="M550 230 H640 V294"/></circle></svg>
