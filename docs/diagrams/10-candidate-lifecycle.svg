<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">Vòng đời bản cải tiến</title><desc id="desc">Candidate đến quarantine, eval độc lập, duyệt G3 rồi dùng trong phạm vi. Thiếu bằng chứng giữ riêng; sự cố cần rollback hoặc revoke.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="#52677f"/></marker>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#b5c8dd" opacity=".26"/></pattern></defs>
<style>text{font-family:"Segoe UI",Arial,sans-serif} .station{animation:breathe 10s ease-in-out infinite} @keyframes breathe{0%,70%,100%{stroke-opacity:.35}35%{stroke-opacity:1}} @media(prefers-reduced-motion:reduce){.motion{display:none}.station{animation:none}}</style>
<rect x="0" y="0" width="1200" height="480" rx="24" fill="#f3f7fc"/><rect width="1200" height="480" fill="url(#grid)" rx="24"/>
<text x="48" y="58" font-size="35" font-weight="750" fill="#13263e" text-anchor="start">Từ đề nghị đến bản được phép dùng</text><text x="48" y="96" font-size="20" font-weight="500" fill="#52677f" text-anchor="start">Một thay đổi cần bằng chứng gắn đúng nội dung, phạm vi và phiên bản.</text><rect x="48" y="168" width="204" height="92" rx="18" fill="#fff" stroke="#cad8e8"/><rect x="48" y="168" width="5" height="92" rx="2" fill="#d97706"/><text x="64" y="202" font-size="20" font-weight="700" fill="#13263e" text-anchor="start">Candidate</text><text x="64" y="232" font-size="16" font-weight="500" fill="#52677f" text-anchor="start">Snapshot + digest</text><path d="M252 214H270" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="motion"><circle r="6" fill="#d97706" stroke="#fff" stroke-width="2"><animateMotion dur="6s" begin="0s" repeatCount="indefinite" path="M252 214H270"/></circle></g><rect x="272" y="168" width="204" height="92" rx="18" fill="#fff" stroke="#cad8e8"/><rect x="272" y="168" width="5" height="92" rx="2" fill="#0891b2"/><text x="288" y="202" font-size="20" font-weight="700" fill="#13263e" text-anchor="start">Quarantine</text><text x="288" y="232" font-size="16" font-weight="500" fill="#52677f" text-anchor="start">Chờ kiểm chứng</text><path d="M476 214H494" fill="none" stroke="#0891b2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="motion"><circle r="6" fill="#0891b2" stroke="#fff" stroke-width="2"><animateMotion dur="6s" begin="1s" repeatCount="indefinite" path="M476 214H494"/></circle></g><rect x="496" y="168" width="204" height="92" rx="18" fill="#fff" stroke="#cad8e8"/><rect x="496" y="168" width="5" height="92" rx="2" fill="#2563eb"/><text x="512" y="202" font-size="20" font-weight="700" fill="#13263e" text-anchor="start">Eval độc lập</text><text x="512" y="232" font-size="16" font-weight="500" fill="#52677f" text-anchor="start">Task mới + retention</text><path d="M700 214H718" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="motion"><circle r="6" fill="#2563eb" stroke="#fff" stroke-width="2"><animateMotion dur="6s" begin="2s" repeatCount="indefinite" path="M700 214H718"/></circle></g><rect x="720" y="168" width="204" height="92" rx="18" fill="#fff" stroke="#cad8e8"/><rect x="720" y="168" width="5" height="92" rx="2" fill="#9333ea"/><text x="736" y="202" font-size="20" font-weight="700" fill="#13263e" text-anchor="start">Duyệt G3</text><text x="736" y="232" font-size="16" font-weight="500" fill="#52677f" text-anchor="start">Đúng digest + scope</text><path d="M924 214H942" fill="none" stroke="#9333ea" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="motion"><circle r="6" fill="#9333ea" stroke="#fff" stroke-width="2"><animateMotion dur="6s" begin="3s" repeatCount="indefinite" path="M924 214H942"/></circle></g><rect x="944" y="168" width="204" height="92" rx="18" fill="#fff" stroke="#cad8e8"/><rect x="944" y="168" width="5" height="92" rx="2" fill="#16805a"/><text x="960" y="202" font-size="20" font-weight="700" fill="#13263e" text-anchor="start">Dùng có giới hạn</text><text x="960" y="232" font-size="16" font-weight="500" fill="#52677f" text-anchor="start">Shadow / canary trước</text><path d="M600 270V326H365V271" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g class="motion"><circle r="6" fill="#d97706" stroke="#fff" stroke-width="2"><animateMotion dur="9s" begin="0s" repeatCount="indefinite" path="M600 270V326H365V271"/></circle></g><text x="482" y="311" font-size="17" font-weight="650" fill="#d97706" text-anchor="middle">Chưa đủ bằng chứng</text><path d="M1046 270V371H770" fill="none" stroke="#9333ea" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 6"/><text x="766" y="363" font-size="18" font-weight="650" fill="#9333ea" text-anchor="end">Sự cố: rollback / revoke</text><text x="48" y="410" font-size="17" font-weight="500" fill="#52677f" text-anchor="start">Rollback đổi bản đang dùng. Revoke thu hồi quyền/nguồn; không tự hoàn tác tác động bên ngoài.</text><text x="48" y="448" font-size="16" font-weight="500" fill="#52677f" text-anchor="start">Mũi tên mô tả quy trình. Mỗi bước có thể dừng hoặc bị từ chối; không phải luồng tự động qua môn.</text>
</svg>